/* ---------- Firebase 設定 ---------- */
const RULES_TEMPLATE = `rules_version = '2';

// 吋讀 Tsundoku 的 Firestore 安全規則（第六階段：家人共用）
// 使用前請把 YOUR_EMAIL@gmail.com 換成管理者（你自己）的 Gmail，要全部小寫。
// 也可以在吋讀的「設定 › 家人與權限 › 更新資料庫規則」直接複製已經填好的版本。
//
// 書庫放在 users/{管理者的 uid} 底下：
//   rooms、cabinets、categories、books、photos、meta：全家共用
//   members/{email}：家人名單和權限（editor 可修改、viewer 只能檢視；minor 初心者看不到限制級的書）
//   people/{uid}/reading、wishlist：每個人自己的閱讀紀錄和願望清單
//   people/{uid}/private：隱私書籍，只有本人看得到（管理者也看不到）
//   people/{uid}/privatePhotos：隱私書籍和願望清單的照片，只有本人看得到
//   people/{uid}/privateBin：隱私書籍的回收桶紀錄（沒有書名），管理者靠它永久刪除
//   circles/{圈}：小圈圈（members 成員、pending 邀請中），circles/{圈}/books、photos：只有圈裡的人看得到
//   circleBin：小圈圈書的回收桶紀錄（有圈名、沒有書名），管理者靠它永久刪除
//   directory：家人名冊（稱呼），拉小圈圈用；moves：書搬到小圈圈的記號
service cloud.firestore {
  match /databases/{database}/documents {
    match /users/{lib} {
      function signedIn() {
        return request.auth != null && request.auth.token.email_verified == true;
      }
      function myEmail() {
        return request.auth.token.email.lower();
      }
      function isOwner() {
        return signedIn() && request.auth.uid == lib && myEmail() == "YOUR_EMAIL@gmail.com";
      }
      function memberPath() {
        return /databases/$(database)/documents/users/$(lib)/members/$(myEmail());
      }
      function isMember() {
        return signedIn() && exists(memberPath());
      }
      function canRead() {
        return isOwner() || isMember();
      }
      function canEdit() {
        return isOwner() || (isMember() && get(memberPath()).data.role == 'editor');
      }
      function isMinor() {
        return !isOwner() && isMember() && get(memberPath()).data.get('minor', false) == true;
      }
      function isSelf(uid) {
        return signedIn() && request.auth.uid == uid && canRead();
      }
      function circlePath(cid) {
        return /databases/$(database)/documents/users/$(lib)/circles/$(cid);
      }
      function inCircle(cid) {
        return canRead() && request.auth.uid in get(circlePath(cid)).data.members;
      }
      // 書搬到小圈圈：同一批寫入要有搬家記號，而且書真的出現在那個小圈圈裡
      function movedToCircle(id) {
        return existsAfter(/databases/$(database)/documents/users/$(lib)/moves/$(id))
          && existsAfter(/databases/$(database)/documents/users/$(lib)/circles/$(getAfter(/databases/$(database)/documents/users/$(lib)/moves/$(id)).data.cid)/books/$(id));
      }
      function photoMovedToCircle(bookId, id) {
        return existsAfter(/databases/$(database)/documents/users/$(lib)/moves/$(bookId))
          && existsAfter(/databases/$(database)/documents/users/$(lib)/circles/$(getAfter(/databases/$(database)/documents/users/$(lib)/moves/$(bookId)).data.cid)/photos/$(id));
      }

      // 共用資料：大家都能看；可修改的人能新增、修改；只有管理者能真的刪除
      match /rooms/{id} {
        allow read: if canRead();
        allow create, update: if canEdit();
        allow delete: if isOwner();
      }
      match /cabinets/{id} {
        allow read: if canRead();
        allow create, update: if canEdit();
        allow delete: if isOwner();
      }
      match /categories/{id} {
        allow read: if canRead();
        allow create, update: if canEdit();
        allow delete: if isOwner();
      }
      // 刪書是把 deletedAt 寫進去（移到回收桶），只有管理者能永久刪除；
      // 例外：把書改成隱私時，可修改的人可以把它從共用書庫拿走（同時要放進自己的隱私書籍）
      // 初心者只讀得到 adult == false 的書
      match /books/{id} {
        allow read: if canRead() && (!isMinor() || resource.data.adult == false);
        allow create, update: if canEdit();
        allow delete: if isOwner()
          || (canEdit() && (existsAfter(/databases/$(database)/documents/users/$(lib)/people/$(request.auth.uid)/private/$(id)) || movedToCircle(id)));
      }
      // 照片：只能檢視的人也能幫自己的願望清單拍照；改照片要權限；刪照片只有管理者（或搬去隱私）
      match /photos/{id} {
        allow read: if canRead();
        allow create: if canRead();
        allow update: if canEdit();
        allow delete: if isOwner()
          || (canEdit() && (existsAfter(/databases/$(database)/documents/users/$(lib)/people/$(request.auth.uid)/privatePhotos/$(id))
                            || photoMovedToCircle(resource.data.bookId, id)));
      }
      // 設定：回收桶的天數和開關只有管理者能改
      match /meta/{id} {
        allow read: if canRead();
        allow create: if isOwner();
        allow update: if isOwner()
          || (canEdit() && !request.resource.data.diff(resource.data).affectedKeys().hasAny(['binDays', 'binOnVerify']));
        allow delete: if isOwner();
      }
      // 家人名單：管理者管理；家人只能看自己那一筆，登入時更新自己的 uid 和最後上線時間
      match /members/{email} {
        allow read: if isOwner() || (signedIn() && myEmail() == email);
        allow create, delete: if isOwner();
        allow update: if isOwner()
          || (signedIn() && myEmail() == email
              && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['uid', 'gname', 'lastSeen']));
      }
      // 每個人自己的閱讀紀錄和願望清單：本人和管理者（備份、還原要用）
      match /people/{uid}/reading/{id} {
        allow read, write: if isOwner() || isSelf(uid);
      }
      match /people/{uid}/wishlist/{id} {
        allow read, write: if isOwner() || isSelf(uid);
      }
      // 隱私書籍：只有本人能看、能改；本人不能直接刪（要丟回收桶），只有管理者能永久刪除。
      // 例外：取消隱私或改成願望清單時，本人可以把它搬走（同時要寫到共用書庫或自己的願望清單）
      match /people/{uid}/private/{id} {
        allow read, create, update: if isSelf(uid);
        allow delete: if isOwner()
          || (isSelf(uid) && (existsAfter(/databases/$(database)/documents/users/$(lib)/books/$(id))
                              || existsAfter(/databases/$(database)/documents/users/$(lib)/people/$(uid)/wishlist/$(id))
                              || movedToCircle(id)));
      }
      match /people/{uid}/privatePhotos/{id} {
        allow read, create, update: if isSelf(uid);
        allow delete: if isSelf(uid) || isOwner();
      }
      match /people/{uid}/privateBin/{id} {
        allow read: if isSelf(uid) || isOwner();
        allow create, update: if isSelf(uid);
        allow delete: if isSelf(uid) || isOwner();
      }
      // 家人名冊：大家都能看；每個人只能寫自己那一筆
      match /directory/{uid} {
        allow read: if canRead();
        allow write: if isSelf(uid);
      }
      match /moves/{id} {
        allow read, create, update: if canRead();
        allow delete: if isOwner();
      }
      // 小圈圈：只有成員和被邀請的人看得到（管理者也一樣）；大家平等。
      //   成員：可以改名、邀請、取消邀請、自己退出（不能直接把別人加進成員）
      //   最後一個人退出：成員變成空的（解散），裡面剩下的書（例如初心者看不到的）由管理者永久刪除
      //   被邀請的人：只能接受（把自己從 pending 移到 members）或拒絕（把自己從 pending 拿掉）
      match /circles/{cid} {
        function dissolvedForOwner() {
          return isOwner() && get(circlePath(cid)).data.members == [];
        }
        allow read: if (canRead() && (request.auth.uid in resource.data.members || request.auth.uid in resource.data.pending))
          || (isOwner() && resource.data.members == []);
        allow create: if canRead() && request.resource.data.members == [request.auth.uid] && !(request.auth.uid in request.resource.data.pending);
        allow update: if canRead() && (
          (request.auth.uid in resource.data.members
            && (request.resource.data.members == resource.data.members
                || request.resource.data.members == resource.data.members.removeAll([request.auth.uid])))
          || (request.auth.uid in resource.data.pending && !(request.auth.uid in resource.data.members)
            && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['members', 'pending', 'updatedAt'])
            && request.resource.data.pending == resource.data.pending.removeAll([request.auth.uid])
            && (request.resource.data.members == resource.data.members
                || request.resource.data.members == resource.data.members.concat([request.auth.uid])))
        );
        allow delete: if isOwner() && resource.data.members == [];
        // 圈裡的書：成員都能新增、修改；刪除（永久）只有管理者，或搬到別的地方
        match /books/{id} {
          allow read: if (inCircle(cid) && (!isMinor() || resource.data.adult == false)) || dissolvedForOwner();
          allow create, update: if inCircle(cid);
          allow delete: if isOwner()
            || (inCircle(cid) && (existsAfter(/databases/$(database)/documents/users/$(lib)/books/$(id))
                                  || existsAfter(/databases/$(database)/documents/users/$(lib)/people/$(request.auth.uid)/private/$(id))
                                  || existsAfter(/databases/$(database)/documents/users/$(lib)/people/$(request.auth.uid)/wishlist/$(id))
                                  || movedToCircle(id)));
        }
        match /photos/{id} {
          allow read, write: if inCircle(cid);
          allow read: if dissolvedForOwner();
          allow delete: if isOwner();
        }
      }
      // 小圈圈書的回收桶紀錄：只有管理者看得到（有圈名、沒有書名）
      match /circleBin/{id} {
        allow read: if isOwner();
        allow create, update: if canRead() && request.auth.uid in get(circlePath(request.resource.data.cid)).data.members;
        allow delete: if isOwner() || (canRead() && request.auth.uid in get(circlePath(resource.data.cid)).data.members);
      }
    }
  }
}
`;
const rulesText = email => RULES_TEMPLATE
  .replace(/\/\/ 使用前請把 YOUR_EMAIL[^\n]*\n\/\/ 也可以在吋讀[^\n]*\n/, `// 管理者：${lowerEmail(email)}（從吋讀複製，已經填好）\n`)
  .split('YOUR_EMAIL@gmail.com').join(lowerEmail(email));
function parseConfig(text) {
  const keys = ['apiKey', 'authDomain', 'projectId', 'storageBucket', 'messagingSenderId', 'appId', 'measurementId'];
  const cfg = {};
  for (const k of keys) { const m = text.match(new RegExp(k + '\\s*["\']?\\s*:\\s*["\']([^"\']+)["\']')); if (m) cfg[k] = m[1].trim(); }
  if (!cfg.apiKey || !cfg.projectId || !cfg.appId) return null;
  if (!cfg.authDomain) cfg.authDomain = cfg.projectId + '.firebaseapp.com';
  return cfg;
}

      const nv = clamp(d[k] + Number(el.dataset.d), 1, max);
      if (nv === d[k]) toast(k === 'rows' ? `列數最多 ${MAX_ROWS}（A 到 Z）` : `欄數最多 ${MAX_COLS}`);
      d[k] = nv; render(); break;
    }
    case 'seg': {
      const s = el.dataset.seg, v = el.dataset.v;
      if (s.startsWith('bk-') || s.startsWith('pick-')) { segExtra(s, v); break; }
      if (s === 'demo-role') { B().setDemoRole(v); toast(`現在是「${ROLE_LABEL[v]}」的身分`); render(); break; }
      if (s === 'ed-depth') d.defaultDepth = +v;
      else if (s === 'ed-numbering') d.numbering = v;
      else if (s === 'ed-tool') app.edTool = v;
      else if (s === 'ed-depthval') app.edDepth = v === 'default' ? 'default' : +v;
      render(); break;
    }
    case 'hdr': hdrPaint(el.dataset.axis, +el.dataset.i); break;
    case 'save-cab': saveCab(); break;
    case 'del-cab': deleteCab(); break;
    case 'use-demo': startDemo(false); break;
    case 'fb-connect': {
      const cfg = parseConfig($('#fb-config').value || '');
      if (!cfg) { toast('看不懂這段設定：請確認裡面有 apiKey、projectId 和 appId', 'err'); return; }
      LS.set('tsundoku-firebase-config', cfg); LS.set('tsundoku-mode', 'firebase');
      startFirebase(cfg); break;
    }
    case 'sign-in': {
      app.loginError = '';
      try { await B().signIn(); if (B().user) await afterLogin(); }
      catch (err) { if (err.code !== 'auth/popup-closed-by-user' && err.code !== 'auth/cancelled-popup-request') { app.loginError = errMsg(err); render(); } }
      break;
    }
    case 'sign-out':
      if (await confirmBox('登出？', '登出後要再用 Google 帳號登入才能看到資料。', '登出')) { await B().signOut(); app.screen = 'login'; render(); }
      break;
    case 'switch-account': try { await B().signOut(); } catch (err) {} app.loginError = ''; app.screen = 'login'; render(); break;
    case 'change-config':
      if (await confirmBox('更換 Firebase 設定？', '這台裝置會忘記目前的 Firebase 設定，資料仍然留在 Firebase 裡。', '更換')) { LS.del('tsundoku-firebase-config'); LS.del('tsundoku-mode'); LS.del(LIB_KEY); location.reload(); }
      break;
    case 'accept-invite': {
      const inv = app.invite; if (!inv) return;
      LS.set('tsundoku-firebase-config', inv.cfg); LS.set(LIB_KEY, { lib: inv.lib, owner: inv.owner }); LS.set('tsundoku-mode', 'firebase');
      app.invite = null; startFirebase(inv.cfg); break;
    }
    case 'decline-invite': app.invite = null; bootMode(); break;
    case 'to-firebase':
      if (await confirmBox('改用 Firebase？', '示範資料不會自動搬過去。想保留的話，可以先匯出完整備份，連上 Firebase 後再匯入。', '繼續')) { LS.del('tsundoku-mode'); app.screen = 'setup'; render(); }
      break;
    case 'reset-demo':
      if (await confirmBox('重設示範資料？', '目前示範模式裡的修改都會被清掉，換回原本的範例。', '重設', true)) { B().resetDemo(); toast('已重設示範資料'); }
      break;
    case 'reload': location.reload(); break;
    case 'export-json': exportJSON(); break;
    case 'export-csv': exportCSV(); break;
    case 'import': $('#import-file').click(); break;
    default: moreAction(a, el);
  }
});
document.addEventListener('input', e => {
  if (e.target.dataset && e.target.dataset.field) { if (e.target.tagName !== 'SELECT') setDraftField(e.target); return; }
  if (e.target.id === 'pick-loan-person') { if (app.pick) app.pick.loanPerson = e.target.value; return; }
  if (e.target.id === 'book-q') { app.bookQuery = e.target.value; resetBookPage(); const l = $('#book-list'); if (l) l.innerHTML = bookListHTML(); return; }
  if (!app.draft) return;
  if (e.target.id === 'ed-code') app.draft.code = e.target.value;
  if (e.target.id === 'ed-name') app.draft.name = e.target.value;
});
document.addEventListener('change', e => {
  if (e.target.tagName === 'SELECT' && e.target.dataset.field) { setDraftField(e.target); return; }
  if (e.target.id === 'import-file' && e.target.files[0]) { importFile(e.target.files[0]); e.target.value = ''; }
});

boot();
</script>
</body>
</html>
