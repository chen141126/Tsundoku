<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff9f6">
<meta name="description" content="吋讀：家庭藏書登記與查詢">
<title>吋讀 Tsundoku</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon-64.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&amp;display=swap">
<style>
:root{
  /* Layout: warm paper shell (big page titles, white cards), wooden bookcases with book spines, floating tab bar with an orange scan button */
  --bg:#fff9f6;
  --peach:#fad3c0;
  --orange:#ff8d22;
  --brown:#905333;
  --wood:#7a5642;
  --ink:#34241c;
  --white:#ffffff;
  --soft:#fdebe2;
  --line:#f0cdb9;
  --line-2:#f6e2d8;
  --cell:#fff3ec;
  --ok:#4f7a28;
  --danger:#b3261e;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
  --shadow:0 1px 2px rgba(52,36,28,.06),0 6px 20px rgba(52,36,28,.06);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--font);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--orange);outline-offset:2px}
[hidden]{display:none !important}
#app{height:100%;display:flex;flex-direction:column;position:relative}
main{flex:1;overflow-y:auto;overflow-x:hidden}
.page{max-width:720px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px 132px;display:flex;flex-direction:column;gap:14px}
.page.no-tabs{padding-bottom:40px}
.page-head{display:flex;flex-direction:column;gap:4px;padding:0 4px 4px}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px;margin:0 -10px 2px}
.toprow.brand{margin:0 0 2px}
.brandrow{display:flex;align-items:center;gap:8px}
.brandrow img{width:30px;height:40px;object-fit:contain}
.brandword{font-weight:900;font-size:20px;letter-spacing:.08em;color:var(--brown)}
.toprow .mid{font-size:15px;font-weight:700}
.toprow .acts{display:flex;align-items:center;gap:8px}
h1.title{margin:4px 0 0;font-size:34px;font-weight:900;line-height:1.2;letter-spacing:.02em}
h1.title .nick{font-size:20px;font-weight:500;color:var(--wood);margin-left:10px;letter-spacing:0}
.sub{margin:0;font-size:14px;color:var(--wood)}
.icon-btn{flex:none;display:grid;place-items:center;width:44px;height:44px;border-radius:14px;border:0;background:transparent;color:var(--ink)}
.icon-btn:hover{background:var(--soft)}
.icon-btn svg{width:22px;height:22px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 18px;border-radius:14px;border:1.5px solid var(--line);background:var(--white);color:var(--ink);font-weight:700;font-size:15px}
.btn:hover{border-color:var(--brown)}
.btn.primary{background:var(--brown);border-color:var(--brown);color:#fff9f6}
.btn.primary:hover{background:#7f4729;border-color:#7f4729}
.btn.accent{background:var(--orange);border-color:var(--orange);color:#ffffff}
.btn.soft{background:var(--peach);border-color:var(--peach);color:var(--ink)}
.btn.soft:hover{border-color:var(--brown)}
.btn.danger{background:transparent;border-color:var(--danger);color:var(--danger)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--soft)}
.btn.small{min-height:38px;padding:0 14px;font-size:14px;border-radius:12px}
.btn.clr{color:var(--orange)}
.btn.wide{width:100%}
.btn svg{width:18px;height:18px}
.link{background:none;border:0;padding:0;color:var(--brown);text-decoration:underline;font-weight:700}
.card{display:block;width:100%;text-align:left;background:var(--white);border:0;border-radius:22px;padding:16px;color:inherit;box-shadow:var(--shadow)}
button.card:active{transform:scale(.99)}
.card h2{margin:0 0 6px;font-size:16px}
.stack{display:flex;flex-direction:column;gap:14px}
.muted{color:var(--wood)}
.small{font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;background:var(--soft);font-size:12px;color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}
.chip.code{border-radius:8px;background:var(--brown);color:#fff9f6;font-family:ui-monospace,"SFMono-Regular",Menlo,monospace}
.chip.line{background:transparent;box-shadow:inset 0 0 0 1px var(--orange)}
.banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;border-radius:16px;font-size:13px;background:var(--soft)}
.banner.warn{background:#fff0e3;box-shadow:inset 0 0 0 1.5px var(--orange)}
.banner.err{background:#fdecea;box-shadow:inset 0 0 0 1.5px var(--danger)}
.banner p{margin:0;flex:1;min-width:180px}
.room{display:flex;flex-direction:column;gap:14px;padding:18px 18px 16px}
.room-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.room-name{display:block;font-size:24px;font-weight:900;line-height:1.25}
.bignum{display:flex;align-items:baseline;gap:3px;flex:none}
.bignum b{font-size:28px;font-weight:900;color:var(--brown);line-height:1;font-variant-numeric:tabular-nums}
.bignum span{font-size:13px;color:var(--wood)}
.shelfstrip{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;padding:14px 14px 12px;border-radius:14px;background:var(--soft);min-height:70px;position:relative}
.shelfstrip::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;border-radius:0 0 14px 14px;background:#e9b79c}
.mini{display:grid;gap:2.5px;align-items:end;padding:2px}
.mini i{display:flex;align-items:flex-end;gap:1px;padding:0 1px;background:var(--cell);outline:2px solid var(--wood);border-radius:1px}
.mini i.o{background:transparent;outline:0}
.mini b{display:block;flex:none;width:2px;border-radius:1px 1px 0 0}
.cab{display:flex;gap:16px;align-items:center}
.cabthumb{flex:none;width:112px;min-height:104px;border-radius:16px;background:var(--soft);display:grid;place-items:center;padding:10px}
.cabinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.cabinfo .t{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.cabinfo .t b{font-size:21px;font-weight:900}
.cabinfo .n{display:flex;align-items:baseline;gap:4px}
.cabinfo .n b{font-size:22px;font-weight:900;color:var(--brown);font-variant-numeric:tabular-nums}
.chev{flex:none;color:var(--wood);width:18px;height:18px}
.add-row{width:100%;min-height:52px;border-radius:18px;border:1.5px dashed #d9a387;background:transparent;color:var(--brown)}
.add-row:hover{border-color:var(--brown)}
.empty{text-align:center;padding:28px 16px}
.empty h2{margin:0 0 6px;font-size:17px}
.hint{margin:0;font-size:13px;line-height:1.6;color:var(--wood)}
.board-wrap{overflow-x:auto;margin:0 -16px;padding:8px 20px 16px}
.board{display:grid;gap:6px;grid-template-columns:18px repeat(var(--cols),minmax(42px,1fr));min-width:min-content;filter:drop-shadow(0 10px 12px rgba(52,36,28,.16))}
.board.editing{grid-template-columns:26px repeat(var(--cols),minmax(32px,1fr));gap:5px;filter:none}
.hdr{display:grid;place-items:center;font-size:11px;color:var(--wood);font-variant-numeric:tabular-nums;background:none;border:0;padding:0;border-radius:8px}
button.hdr{background:var(--peach);color:var(--ink);font-weight:700;font-size:12px}
.cell{position:relative;min-width:0;border:0;border-radius:3px;background:var(--cell);color:var(--ink);padding:0;display:block;overflow:hidden;box-shadow:0 0 0 3.5px var(--wood),inset 0 7px 8px -7px rgba(52,36,28,.45)}
.cell.off{background:transparent;box-shadow:none;visibility:hidden}
button.cell:hover{box-shadow:0 0 0 3.5px var(--wood),0 0 0 6.5px var(--orange),inset 0 7px 8px -7px rgba(52,36,28,.45)}
.cell .lbl{position:absolute;top:3px;left:5px;font-size:10px;line-height:1.2;color:var(--wood);z-index:1}
.cell .cnt{position:absolute;top:3px;right:5px;font-size:11px;line-height:1.2;font-weight:700;z-index:1}
.cell .spines{position:absolute;left:4px;right:4px;bottom:0;top:18px;display:flex;align-items:flex-end;gap:1px;overflow:hidden}
.cell .spines i{flex:none;width:3.5px;border-radius:1.5px 1.5px 0 0}
.legend{display:flex;align-items:center;gap:10px;margin:2px 4px 0;font-size:12.5px;line-height:1.6;color:var(--wood)}
.legend .sp{flex:none;display:flex;align-items:flex-end;gap:1px;height:18px}
.legend .sp i{width:3.5px;border-radius:1px}
.editing .cell{display:grid;place-items:center;visibility:visible;overflow:visible;border:1.5px solid var(--line);border-radius:10px;background:var(--white);box-shadow:0 1px 2px rgba(52,36,28,.06);touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer}
.editing .cell.off{background:transparent;border:1.5px dashed #e4b49b;box-shadow:none}
.editing .cell .lbl{left:6px}
.editing .cell.off .lbl{opacity:.55}
.cell .dep{font-size:15px;color:var(--wood)}
.cell .dep.set{font-weight:900;color:var(--ink);background:var(--peach);border-radius:8px;padding:0 7px}
.editing .cell.tall{background-image:repeating-linear-gradient(135deg,transparent 0 6px,rgba(255,141,34,.15) 6px 12px)}
.cell .tallmark{position:absolute;bottom:3px;right:4px;font-size:10px;line-height:1.5;padding:0 5px;border-radius:5px;background:var(--brown);color:#fff9f6}
.form{display:flex;flex-direction:column;gap:14px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid-code{display:grid;grid-template-columns:84px minmax(0,1fr);gap:10px}
.field{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--wood);min-width:0}
.field input,.field textarea{width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--ink);font-size:16px}
.field input{height:46px}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 3px rgba(255,141,34,.18)}
.field textarea{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;line-height:1.6;resize:vertical}
.stepper{display:flex;align-items:center;justify-content:space-between;height:46px;border-radius:12px;background:var(--soft);padding:0 4px}
.stepper button{width:38px;height:38px;border-radius:10px;border:0;background:var(--white);color:var(--ink);font-size:20px}
.stepper output{font-size:18px;font-weight:900;color:var(--ink);font-variant-numeric:tabular-nums}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;padding:4px;border-radius:14px;background:var(--soft)}
.seg button{border:0;background:transparent;min-height:38px;padding:0 8px;border-radius:10px;font-size:14px;color:var(--wood)}
.seg button[aria-checked="true"],.seg button[aria-selected="true"]{background:var(--white);color:var(--ink);font-weight:700;box-shadow:0 1px 4px rgba(52,36,28,.12)}
.tools{background:var(--wood);color:#fff9f6;border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:10px}
.tools .seg{background:transparent;padding:0;gap:6px}
.tools .seg.big button{min-height:58px;border-radius:14px;background:rgba(255,249,246,.1);color:#fff9f6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:13px}
.tools .seg.big button svg{width:20px;height:20px}
.tools .seg.small button{min-height:34px;background:rgba(255,249,246,.1);color:#fff9f6}
.tools .seg button[aria-checked="true"]{background:var(--orange);color:#ffffff;font-weight:700;box-shadow:none}
.tools p{margin:0;font-size:12.5px;line-height:1.6;color:var(--peach)}
.summary{margin:0;font-size:13px;color:var(--wood);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.group{display:flex;flex-direction:column;gap:8px}
.group > h2{margin:0 6px;font-size:13px;font-weight:700;color:var(--wood);letter-spacing:.06em}
.list{background:var(--white);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border:0;border-bottom:1px solid var(--line-2);background:transparent;text-align:left;font-size:15px;color:var(--ink)}
.row:last-child{border-bottom:0}
button.row:hover{background:var(--bg)}
.row .ic{flex:none;width:36px;height:36px;border-radius:11px;background:var(--soft);display:grid;place-items:center;color:var(--brown)}
.row .ic svg{width:20px;height:20px}
.row .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.row .tx b{font-size:15px}
.row .tx span{font-size:12px;color:var(--wood);word-break:break-all}
.row .mono{font-family:ui-monospace,Menlo,monospace}
.status{display:flex;align-items:center;gap:5px;flex:none;font-size:12px;font-weight:700;color:var(--ok)}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.status.demo{color:var(--brown)}
.owners{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.owner{display:inline-flex;align-items:center;gap:2px;height:38px;padding:0 4px 0 14px;border-radius:999px;background:var(--peach);font-size:15px;font-weight:700}
.owner button{width:30px;height:30px;border-radius:50%;border:0;background:transparent;color:var(--wood);font-size:16px}
.owner button:hover{background:rgba(255,255,255,.6);color:var(--ink)}
.add-chip{height:38px;padding:0 14px;border-radius:999px;border:1.5px dashed #d9a387;background:transparent;color:var(--brown);font-size:14px;font-weight:700}
.backup-status{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:14px;background:var(--soft);margin-bottom:12px}
.backup-status b{display:block;font-size:20px;font-weight:900}
.about{display:flex;align-items:center;justify-content:space-between;gap:12px}
.about b{font-size:17px;font-weight:900;color:var(--brown);letter-spacing:.04em}
.stats{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-end;margin-bottom:8px}
.stats b{display:block;font-size:40px;font-weight:900;color:var(--brown);line-height:1.05;font-variant-numeric:tabular-nums}
.roadmap{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.roadmap li{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.roadmap .st{flex:none;width:54px;text-align:center;padding:1px 0;border-radius:999px;font-size:12px;font-weight:700;background:var(--soft);color:var(--wood)}
.roadmap .st.done{background:#e6efdc;color:var(--ok)}
.roadmap .st.next{background:var(--orange);color:#ffffff}
.soon{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:30px 20px}
.soon .badge{width:64px;height:64px;border-radius:50%;background:var(--soft);display:grid;place-items:center;color:var(--brown)}
.soon .badge svg{width:30px;height:30px}
.soon h2{margin:0;font-size:18px}
.tabbar{position:absolute;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;height:66px;border-radius:24px;background:var(--white);box-shadow:0 10px 30px rgba(52,36,28,.16);display:flex;align-items:center;justify-content:space-around;padding:0 4px;z-index:5}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;width:62px;padding:0;border:0;background:transparent;color:var(--wood);font-size:11px}
.tabbar .ico{display:grid;place-items:center;padding:3px 14px;border-radius:12px}
.tabbar svg{width:22px;height:22px}
.tabbar button.on{color:var(--ink);font-weight:700}
.tabbar button.on .ico{background:var(--peach)}
.tabbar .fab{color:var(--ink);font-weight:700}
.tabbar .fab .ico{width:58px;height:58px;margin-top:-32px;padding:0;border-radius:50%;background:var(--orange);color:#ffffff;border:4px solid var(--bg);box-shadow:0 6px 16px rgba(255,141,34,.38)}
.tabbar .fab.on .ico{background:var(--orange);box-shadow:0 0 0 3px var(--peach),0 6px 16px rgba(255,141,34,.38)}
.tabbar .fab svg{width:24px;height:24px}
.center-screen{height:100%;overflow:auto;display:flex;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 40px) 20px 32px}
.setup{width:100%;max-width:440px;display:flex;flex-direction:column;gap:18px}
.hero{display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px 0 6px}
.hero img{width:130px;height:174px;object-fit:contain}
.hero h1{margin:4px 0 0;font-size:48px;font-weight:900;letter-spacing:.12em;color:var(--brown);line-height:1.1}
.hero p{margin:0;font-size:14px;color:var(--wood);letter-spacing:.04em;text-align:center}
.card-head{display:flex;align-items:center;gap:10px}
.card-head h2{margin:0;font-size:18px}
.stepnum{flex:none;width:28px;height:28px;border-radius:50%;background:var(--peach);font-weight:700;font-size:14px;display:grid;place-items:center}
.stepnum svg{width:16px;height:16px}
.row.col{flex-direction:column;align-items:stretch;gap:10px}
.qrbox{width:min(240px,70vw);margin:4px auto 12px;padding:8px;background:#fff;border-radius:14px;box-shadow:inset 0 0 0 1px var(--line)}
.qrbox svg{display:block;width:100%;height:auto}
.rulesbox{width:100%;font-size:11px;line-height:1.45;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--cell);color:var(--ink);resize:vertical}
.binbooks .row{align-items:center}
.binbooks .tx{min-width:0}
.binacts{display:flex;flex-direction:column;gap:6px;flex:none}
.dashed{display:flex;align-items:center;gap:14px;padding:18px 20px;border-radius:22px;border:1.5px dashed #e4b49b}
.dashed .tx{flex:1;display:flex;flex-direction:column;gap:3px}
.dashed .tx b{font-size:16px}
.footnote{margin:auto 0 0;text-align:center;font-size:12px;color:var(--wood)}
.spinner{width:36px;height:36px;margin:0 auto;border-radius:50%;border:3px solid var(--peach);border-top-color:var(--orange);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.layer{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(52,36,28,.45)}
.layer.as-sheet{align-items:flex-end;padding:0}
.dlg{position:relative;width:100%;max-width:440px;max-height:86vh;overflow:auto;background:var(--bg);border-radius:22px;padding:20px 18px 18px;box-shadow:0 20px 60px rgba(52,36,28,.28)}
.as-sheet .dlg{max-width:560px;border-radius:28px 28px 0 0;padding:28px 20px calc(20px + env(safe-area-inset-bottom,0px))}
.as-sheet .dlg::before{content:"";position:absolute;top:10px;left:50%;width:44px;height:5px;margin-left:-22px;border-radius:3px;background:#e4b49b}
.dlg h2{margin:0 0 10px;font-size:18px;font-weight:900;word-break:break-all}
.dlg-body p{margin:0 0 10px}
.dlg-body .field{margin-bottom:4px}
.dlg-actions{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;margin-top:16px}
.dlg-actions.vertical{flex-direction:column}
.dlg-actions.vertical .btn{width:100%}
.sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.sheet-head h2{margin:0;font-size:28px;line-height:1.2}
.round-btn{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;border:0;background:var(--soft);color:var(--ink)}
.round-btn svg{width:18px;height:18px}
.depth-tabs{margin-top:14px}
.depth-tabs button{min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.35}
.depth-tabs button small{font-size:11px;font-weight:400;color:var(--wood)}
.booklist{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
.booklist li{display:flex;align-items:center;gap:12px;padding:8px 4px;border-radius:14px}
.mcover{flex:none;width:38px;height:54px;border-radius:3px 6px 6px 3px;writing-mode:vertical-rl;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;letter-spacing:.05em;box-shadow:inset 3px 0 0 rgba(0,0,0,.15),0 2px 6px rgba(52,36,28,.18)}
.binfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.binfo b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.binfo span{font-size:12px;color:var(--wood)}

<script type="module">
/* ========= 吋讀 Tsundoku · 第一階段：地基、書櫃編輯器、匯出備份 ========= */
const VERSION = '0.6.2';
const SCHEMA_VERSION = 1;
const FB_VERSION = '10.12.2';
const COLS = ['rooms', 'cabinets', 'categories', 'books'];
// 以下常數是書籍資料規格的一部分，第二階段登記功能會用到
const FORMATS = ['平裝', '精裝', '軟精裝', '線裝', '其他'];
const ROLES = ['著', '譯', '編', '繪', '校訂', '審訂', '導讀', '攝影'];
const ROLE_ALIAS = { 作: '著', 撰: '著', 原著: '著', 著者: '著', 作者: '著', 翻譯: '譯', 譯者: '譯', 主編: '編', 編著: '編', 編者: '編', 編輯: '編', 插畫: '繪', 繪圖: '繪', 圖: '繪', 繪者: '繪', 校注: '校訂', 校註: '校訂', 校對: '校訂', 校: '校訂', 審定: '審訂', 監修: '審訂', 攝: '攝影' };
const normRole = r => { r = String(r || '').trim(); return ROLES.includes(r) ? r : ROLE_ALIAS[r] || '著'; };
const READ_STATUS = { unread: '未閱讀', reading: '閱讀中', done: '閱畢', dropped: '棄讀' };
const LANGS = { eng: '英語', jpn: '日語', kor: '韓語', fra: '法語', deu: '德語', spa: '西班牙語' };
const EDITIONS = ['初版', '再版', '三版', '四版', '五版', '六版', '七版', '八版', '九版', '十版'];
const CUSTOM = '__custom';
const MAX_ROWS = 26, MAX_COLS = 30;

/* ---------- 小工具 ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
const newId = () => { try { return crypto.randomUUID().replace(/-/g, '').slice(0, 20); } catch (e) { return Date.now().toString(36) + Math.random().toString(36).slice(2, 12); } };
const nowISO = () => new Date().toISOString();
const clone = o => JSON.parse(JSON.stringify(o));
const fmtDate = iso => iso ? new Date(iso).toLocaleDateString('zh-TW', { year: 'numeric', month: '2-digit', day: '2-digit' }) : '';
const daysSince = iso => iso ? Math.floor((Date.now() - new Date(iso).getTime()) / 86400000) : Infinity;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
const stamp = () => { const d = new Date(), p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`; };

const MEM = {};
const LS = {
  get(k) { try { const v = localStorage.getItem(k); if (v != null) return JSON.parse(v); } catch (e) {} return k in MEM ? MEM[k] : null; },
  set(k, v) { MEM[k] = v; try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { delete MEM[k]; try { localStorage.removeItem(k); } catch (e) {} }
};

/* ---------- 資料規格 v1 ---------- */
function defaultMeta() { return { owners: ['爸爸', '我'], publishers: [], languages: [], binOnVerify: true, binDays: 30, lastBackupAt: null }; }
function newRoom(name, order) { return { id: newId(), name, order, createdAt: nowISO() }; }
function newCabinet(roomId, code) {
  const t = nowISO();
  // r = 由上往下第幾列（0 起算），c = 由左往右第幾欄；off/tall/depth 的鍵為 "r-c"
  return { id: newId(), roomId, code, name: '', rows: 5, cols: 4, defaultDepth: 2, numbering: 'top', off: [], tall: [], depth: {}, createdAt: t, updatedAt: t };
}
function newBook(p = {}) {
  const t = nowISO();
  return Object.assign({
    id: newId(), schemaVersion: SCHEMA_VERSION,
    title: '', subtitle: '', originalTitle: '', series: '', volume: null, edition: '', printing: null, // printing = 第幾刷
    authors: [],               // [{ name: '唐德剛', role: '著' }]
    publisher: '', publishedDate: '',   // YYYY、YYYY-MM 或 YYYY-MM-DD
    isbn: '',                  // 13 碼，不含連字號
    format: '', language: '', script: '', // language: ISO 639-2（zho、eng…）；script: Hant / Hans
    pages: null, categories: [], summary: '', cover: '',
    ownership: 'owned',        // owned 已收藏 / wishlist 願望清單 / borrowed 借來的
    owner: '', quantity: 1, location: null, // { cabinetId, r, c, depth }
    locationNote: '', price: null, currency: 'TWD', purchaseDate: '', tags: [],
    rating: null, readStatus: 'unread', currentPage: null, startDate: '', finishDate: '', favorite: false, review: '',
    loan: null,                // { dir: 'out' 借出 / 'in' 借入, person, date, due 預計歸還 }
    photoBin: [],              // 回收桶裡的照片：{ id, kind, at, size }
    adult: false,              // 限制級：初心者（未成年）看不到
    loanHistory: [], verified: false, addedAt: t, updatedAt: t
  }, p);
}

/* ---------- 書櫃座標 ---------- */
const cellKey = (r, c) => r + '-' + c;
const splitKey = k => k.split('-').map(Number);
const rowLetter = (cab, r) => String.fromCharCode(65 + (cab.numbering === 'bottom' ? cab.rows - 1 - r : r));
const cellLabel = (cab, r, c) => rowLetter(cab, r) + (c + 1);
const isOff = (cab, k) => cab.off.includes(k);
const isTall = (cab, k) => cab.tall.includes(k) && !isOff(cab, k);
const cellDepth = (cab, k) => (cab.depth && cab.depth[k]) || cab.defaultDepth;
function activeCount(cab) { let n = 0; for (let r = 0; r < cab.rows; r++) for (let c = 0; c < cab.cols; c++) if (!isOff(cab, cellKey(r, c))) n++; return n; }
function tallRows(cab) { const s = new Set(); cab.tall.forEach(k => { const [r, c] = splitKey(k); if (r < cab.rows && c < cab.cols && !isOff(cab, k)) s.add(r); }); return s; }
function locValid(cab, loc) {
  if (!loc || loc.r >= cab.rows || loc.c >= cab.cols) return false;
  const k = cellKey(loc.r, loc.c);
  return !isOff(cab, k) && loc.depth >= 1 && loc.depth <= cellDepth(cab, k);
}
function locCode(book) {
  const loc = book.location; if (!loc) return '';
  const cab = B().cache.cabinets[loc.cabinetId]; if (!cab) return '';
  const room = B().cache.rooms[cab.roomId];
  return `${room ? room.name : '?'}-${cab.code}-${cellLabel(cab, loc.r, loc.c)}-${loc.depth}`;
}
const authorsText = b => (b.authors || []).map(a => a.name + (a.role && a.role !== '著' ? `（${a.role}）` : '')).join('、');
function langLabel(b) {
  if (!b.language) return '';
  if (b.language === 'zho') return b.script === 'Hans' ? '簡體中文' : '正體中文';
  return LANGS[b.language] || b.language;
}

/* ---------- QR code（邀請家人用） ----------
   QRCode for JavaScript, Copyright (c) 2009 Kazuhiko Arase, MIT license；取自 qrcode-terminal（Apache-2.0）的整理版 */
const QRGen = (() => {
  const F = {}, C = {};
  const req = n => { n = n.replace(/^\.\//, '').replace(/\.js$/, ''); if (!(n in C)) { const m = { exports: {} }; C[n] = m.exports; F[n](m, m.exports); C[n] = m.exports; } return C[n]; };
  F['QR8bitByte'] = function (module, exports) {
var QRMode = req('./QRMode');

function QR8bitByte(data) {
	this.mode = QRMode.MODE_8BIT_BYTE;
	this.data = data;
}

QR8bitByte.prototype = {

	getLength : function() {
		return this.data.length;
	},
	
	write : function(buffer) {
		for (var i = 0; i < this.data.length; i++) {
			// not JIS ...
			buffer.put(this.data.charCodeAt(i), 8);
		}
	}
};

module.exports = QR8bitByte;

  };
  F['QRBitBuffer'] = function (module, exports) {
function QRBitBuffer() {
	this.buffer = [];
	this.length = 0;
}

QRBitBuffer.prototype = {

	get : function(index) {
		var bufIndex = Math.floor(index / 8);
		return ( (this.buffer[bufIndex] >>> (7 - index % 8) ) & 1) == 1;
	},
	
	put : function(num, length) {
		for (var i = 0; i < length; i++) {
			this.putBit( ( (num >>> (length - i - 1) ) & 1) == 1);
		}
	},
	
	getLengthInBits : function() {
		return this.length;
	},
	
	putBit : function(bit) {
	
		var bufIndex = Math.floor(this.length / 8);
		if (this.buffer.length <= bufIndex) {
			this.buffer.push(0);
		}
	
		if (bit) {
			this.buffer[bufIndex] |= (0x80 >>> (this.length % 8) );
		}
	
		this.length++;
	}
};

module.exports = QRBitBuffer;

  };
  F['QRErrorCorrectLevel'] = function (module, exports) {
module.exports = {
	L : 1,
	M : 0,
	Q : 3,
	H : 2
};


  };
  F['QRMaskPattern'] = function (module, exports) {
module.exports = {
	PATTERN000 : 0,
	PATTERN001 : 1,
	PATTERN010 : 2,
	PATTERN011 : 3,
	PATTERN100 : 4,
	PATTERN101 : 5,
	PATTERN110 : 6,
	PATTERN111 : 7
};

  };
  F['QRMath'] = function (module, exports) {
var QRMath = {

	glog : function(n) {
	
		if (n < 1) {
			throw new Error("glog(" + n + ")");
		}

  startSync(onError) {

        this.unsubs.push(F.onSnapshot(F.query(this.dcol('circles'), F.where('members', '==', [])), async snap => {
          const m = {};
          for (const d of snap.docs) {
            let n = 0; try { n = (await F.getDocs(this.dcol('circles', d.id, 'books'))).size; } catch (e) {}
            if (n) m[d.id] = { id: d.id, name: d.data().name, dissolvedAt: d.data().dissolvedAt, count: n };

          this.dissolved = m; this._emit();
        }, () => {}));
      } else {
        // 管理者改了我的權限、初心者設定，或把我移出名單，馬上生效
        let firstR = true;
        this.unsubs.push(F.onSnapshot(this.dref('members', this.me.email), d => {
          const was = this.role, wasMinor = this.minor;
          if (!d.exists()) this.role = null; else { const m = d.data(); this.role = m.role === 'editor' ? 'editor' : 'viewer'; this.minor = !!m.minor; this.me.name = m.name || this.me.name; }

    });
  }
  // 我在裡面的小圈圈：各自聽它的書（初心者一樣只拿 adult == false）
  _afterCircles() {
    if (!this.F) return;
    const want = new Set(Object.values(this.cIn).map(c => c.id));
    for (const cid of Object.keys(this.cUnsubs)) if (!want.has(cid)) { this.cUnsubs[cid](); delete this.cUnsubs[cid]; delete this.cbooks[cid]; }
    for (const cid of want) {

      this.cUnsubs[cid] = this.F.onSnapshot(this.minor ? this.F.query(col, this.F.where('adult', '==', false)) : col, snap => {
        const m = {}; snap.forEach(d => { m[d.id] = { ...d.data(), id: d.id }; }); this.cbooks[cid] = m; this.rebuild(); this._emit();

  // 管理者：看得到每個家人的隱私回收桶「有幾本」（沒有書名），才能幫忙永久刪除
  _watchPrivateBins() {
    const uids = new Set(Object.values(this.members).map(m => m.uid).filter(u => u && u !== this.me.uid));
    for (const uid of Object.keys(this.binUnsubs)) if (!uids.has(uid)) { this.binUnsubs[uid](); delete this.binUnsubs[uid]; Object.keys(this.privTrash).forEach(k => { if (k.startsWith(uid + '/')) delete this.privTrash[k]; }); }

        Object.keys(this.privTrash).forEach(k => { if (k.startsWith(uid + '/')) delete this.privTrash[k]; });

        if (k === 'shared') b.set(this.dref(a, x), clone(y));
        else if (k === 'delShared') b.delete(this.dref(a, x));
        else if (k === 'mine') b.set(this.dref('people', uid || this.me.uid, a, x), clone(y));
        else if (k === 'delMine') b.delete(this.dref('people', uid || this.me.uid, a, x));

        else if (k === 'delPhoto') b.delete(this.dref('photos', a));
        else if (k === 'circle') b.set(this.dref('circles', a), clone(x));
        else if (k === 'delCircle') b.delete(this.dref('circles', a));
        else if (k === 'circleBook') b.set(this.dref('circles', a, 'books', x), clone(y));
        else if (k === 'delCircleBook') b.delete(this.dref('circles', a, 'books', x));
        else if (k === 'circlePhoto') b.set(this.dref('circles', a, 'photos', x), clone(y));
        else if (k === 'delCirclePhoto') b.delete(this.dref('circles', a, 'photos', x));

  async exportAll() {

  }
  async importAll(data, mode) {
    if (!this.isAdmin) return this._denied();
    const { shared, people, members } = this.splitImport(data);
    const F = this.F, ops = [], incoming = new Set();
    for (const c of [...COLS, 'photos']) shared[c].forEach(x => incoming.add(c + '/' + x.id));
    if (mode === 'replace') {
      for (const c of COLS) Object.keys(this.raw[c]).forEach(id => { if (!incoming.has(c + '/' + id)) ops.push(['delShared', c, id]); });
      const ps = await F.getDocs(this.dcol('photos'));
      ps.docs.forEach(d => { if (!incoming.has('photos/' + d.id)) ops.push(['delPhoto', d.id]); });
    }
    for (const c of COLS) shared[c].forEach(x => ops.push(['shared', c, x.id, x]));
    shared.photos.forEach(p => ops.push(['photo', p.id, p]));

      const kinds = uid === this.me.uid ? ['reading', 'wishlist', 'private', 'privatePhotos'] : ['reading', 'wishlist'];   // 別人的隱私書籍管理者寫不進去
      if (mode === 'replace') {

}

/* ---------- App 狀態 ---------- */
const app = { screen: 'loading', mode: null, B: null, tab: 'shelf', stack: [], draft: null, draftOrig: '', edTool: 'toggle', edDepth: 'default', histOK: false, ignorePop: false, preview: false, inFrame: false, loginError: '', syncError: '', loadingMsg: '',
  session: LS.get('tsundoku-session') || { location: null, owner: '' }, scan: { status: 'idle', camera: 'off', lastCode: '', lastAt: 0, lastSaved: '', looking: '' },
  bookDraft: null, bookDraftOrig: '', photoCache: {}, bookQuery: '', bookFilter: 'all', pick: null, prevTab: 'shelf',
  gb: { status: '', keyBad: false }, bookCat: '', bookAdv: {}, bookShow: 150 };
const B = () => app.B;
const cur = () => app.stack[app.stack.length - 1];

const openDialogs = [];
function dialog({ title, body = '', actions = [], sheet = false, vertical = false, hideTitle = false, focus = true, cls = '', titleHTML = '', layerCls = '', onOpen }) {
  return new Promise(resolve => {
    const el = document.createElement('div');
    el.className = 'layer' + (sheet ? ' as-sheet' : '') + (layerCls ? ' ' + layerCls : '');
    el.innerHTML = `<div class="dlg${cls ? ' ' + cls : ''}" role="dialog" aria-modal="true" aria-label="${esc(title)}">${hideTitle ? '' : titleHTML ? `<div class="dlg-head"><h2>${esc(title)}</h2>${titleHTML}</div>` : `<h2>${esc(title)}</h2>`}<div class="dlg-body">${body}</div>${actions.length ? `<div class="dlg-actions${vertical ? ' vertical' : ''}">${actions.map((a, i) => `<button type="button" class="btn ${a.kind || ''}" data-i="${i}">${esc(a.label)}</button>`).join('')}</div>` : ''}</div>`;
    const entry = { el, close: v => { el.remove(); const i = openDialogs.indexOf(entry); if (i >= 0) openDialogs.splice(i, 1); resolve(v); } };
    el.addEventListener('click', ev => {
      if (ev.target === el) { entry.close(null); return; }
      const btn = ev.target.closest('.dlg-actions button'); if (!btn) return;
      const a = actions[+btn.dataset.i];
      const v = a.get ? a.get(el) : (a.value === undefined ? null : a.value);
      if (a.validate && !a.validate(el)) return;
      entry.close(v);
    });
    el.addEventListener('keydown', ev => {
      if (ev.key === 'Escape') entry.close(null);
      if (ev.key === 'Enter' && ev.target.tagName === 'INPUT') { const i = actions.findIndex(a => a.kind === 'primary'); if (i >= 0) { ev.preventDefault(); el.querySelector(`.dlg-actions [data-i="${i}"]`).click(); } }
    });
    $('#layer').append(el); openDialogs.push(entry);
    if (onOpen) onOpen(el, entry.close);
    const f = focus ? (el.querySelector('input,textarea') || el.querySelector('.dlg-actions .primary') || el.querySelector('.dlg-actions button')) : null;
    if (f) setTimeout(() => f.focus(), 30);
  });
}
const confirmBox = (title, msg, ok = '確定', danger = false) => dialog({ title, body: `<p>${esc(msg)}</p>`, actions: [{ label: '取消', kind: 'ghost', value: false }, { label: ok, kind: danger ? 'danger' : 'primary', value: true }] });

    actions: [{ label: '取消', kind: 'ghost', value: null }, { label: '確定', kind: 'primary', get: el => el.querySelector('input').value.trim(), validate: el => { const ok = !!el.querySelector('input').value.trim(); if (!ok) toast('請輸入名稱', 'err'); return ok; } }]
  });
}
function toast(msg, kind = '') {
  const t = document.createElement('div'); t.className = 'toast ' + kind; t.textContent = msg;
  $('#toasts').append(t); setTimeout(() => t.remove(), kind === 'err' ? 5200 : 2600);
}

/* ---------- 導覽 ---------- */
function pushLevel() { try { history.pushState({ tsundoku: true }, ''); app.histOK = true; } catch (e) { app.histOK = false; } }
function go(v) { app.stack.push(v); pushLevel(); render(); }
function requestBack() { if (app.histOK) history.back(); else doBack(); }
async function doBack() {
  const v = cur();
  if (v && v.name === 'editor' && edDirty()) {
    const ok = await confirmBox('放棄修改？', '這座書櫃的修改還沒儲存。', '放棄修改', true);
    if (!ok) return false;
    app.draft = null;
  }
  if (v && v.name === 'bookEdit' && app.bookDraft && app.bookDraft.origin !== 'scan' && bookDirty()) {
    const ok = await confirmBox('放棄修改？', '這本書的修改還沒儲存。', '放棄修改', true);
    if (!ok) return false;
  }
  if (v && v.name === 'bookEdit' && app.bookDraft && app.bookDraft.origin !== 'scan') app.bookDraft = null;
  if (app.stack.length > 1) app.stack.pop();
  render(); return true;
}
function popLevels(n) {
  app.stack.length = Math.max(1, app.stack.length - n);
  if (app.histOK) { app.ignorePop = true; try { history.go(-n); } catch (e) { app.ignorePop = false; } }
  render();
}
window.addEventListener('popstate', async () => {
  if (app.ignorePop) { app.ignorePop = false; return; }
  if (openDialogs.length) { openDialogs[openDialogs.length - 1].close(null); pushLevel(); return; }
  if (app.screen === 'main' && app.stack.length > 1) { const ok = await doBack(); if (!ok) pushLevel(); }
});
function switchTab(t) {
  if (cur() && cur().name === 'editor' && edDirty()) { toast('請先儲存或放棄書櫃的修改', 'err'); return; }
  if (t === 'scan' && app.tab !== 'scan') app.prevTab = app.tab;
  app.draft = null; app.tab = t;
  app.stack = [{ name: t === 'shelf' ? 'rooms' : t }];
  render();
}

/* ---------- 計數 ---------- */
function bookStats() {
  const byCab = {}, byCell = {}, pendByCab = {};
  let owned = 0, pending = 0, wish = 0, borrowed = 0, loans = 0;
  for (const b of Object.values(B().cache.books)) {
    if (b.ownership === 'wishlist') { wish++; continue; }
    if (b.loan) loans++;
    if (b.ownership === 'borrowed') borrowed++; else owned++;
    if (!b.verified) pending++;
    const loc = b.location; if (!loc) continue;
    byCab[loc.cabinetId] = (byCab[loc.cabinetId] || 0) + 1;
    if (!b.verified) pendByCab[loc.cabinetId] = (pendByCab[loc.cabinetId] || 0) + 1;
    const m = byCell[loc.cabinetId] || (byCell[loc.cabinetId] = {});
    const k = cellKey(loc.r, loc.c);
    m[k] = (m[k] || 0) + 1;
  }
  return { byCab, byCell, pendByCab, owned, pending, wish, borrowed, loans };
}
const sortedRooms = () => Object.values(B().cache.rooms).sort((a, b) => (a.order - b.order) || String(a.createdAt).localeCompare(String(b.createdAt)));

const SPINE_COLORS = ['#905333', '#ff8d22', '#7a5642', '#fad3c0', '#fff9f6', '#905333', '#7a5642'];
function rng(seedText) {
  let h = 2166136261;
  for (let i = 0; i < seedText.length; i++) { h ^= seedText.charCodeAt(i); h = Math.imul(h, 16777619); }
  return () => { h = Math.imul(h ^ (h >>> 15), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909); h ^= h >>> 16; return (h >>> 0) / 4294967296; };
}

function spinesHTML(seed, n, max, tag = 'i', minH = 58) {

    const c = SPINE_COLORS[Math.floor(r() * SPINE_COLORS.length)];
    h += `<${tag} style="height:${Math.round(minH + r() * (96 - minH))}%;background:${c}${lightSpine(c) ? ';box-shadow:inset 0 0 0 .6px rgba(52,36,28,.4)' : ''}"></${tag}>`;
  }

}

}
function miniHTML(cab, counts, s) {

    const k = cellKey(r, c), h = tr.has(r) ? Math.round(s * 1.5) : s;

}

    return;
  }

}
function paintValue(k) {
  const d = app.draft;

}
function bindEditor() {
  const board = $('[data-board]'); if (!board) return;
  let paint = null;
  const apply = k => {
    if (!paint || paint.seen.has(k)) return;
    paint.seen.add(k);
    setCell(app.draft, k, app.edTool, paint.val);
    const el = board.querySelector(`.cell[data-key="${k}"]`);
    if (el) { const [r, c] = splitKey(k); el.outerHTML = editorCellHTML(app.draft, r, c); }
  };
  board.addEventListener('pointerdown', e => {
    const cell = e.target.closest('.cell[data-key]'); if (!cell) return;
    e.preventDefault();
    paint = { val: paintValue(cell.dataset.key), seen: new Set() };
    apply(cell.dataset.key);
    try { board.setPointerCapture(e.pointerId); } catch (_) {}
  });
  board.addEventListener('pointermove', e => {
    if (!paint) return;
    const el = document.elementFromPoint(e.clientX, e.clientY);
    const cell = el && el.closest('.cell[data-key]');
    if (cell && board.contains(cell)) apply(cell.dataset.key);

  board.addEventListener('pointerup', end);

  board.addEventListener('keydown', e => {

    e.preventDefault();

}
function hdrPaint(axis, i) {

const COVER_COLORS = [['#905333', '#fff9f6'], ['#7a5642', '#fff9f6'], ['#ff8d22', '#ffffff'], ['#fad3c0', '#34241c'], ['#fff9f6', '#34241c']];

function openCell(cabId, k) {
  const c = B().cache.cabinets[cabId]; if (!c) return;

  const [r, col] = splitKey(k), d = cellDepth(c, k), label = cellLabel(c, r, col);
  const cellBooks = () => shelfSort(Object.values(B().cache.books).filter(b => b.ownership !== 'wishlist' && b.location && b.location.cabinetId === cabId && b.location.r === r && b.location.c === col));
  const layerName = i => d === 1 ? '這一格' : i === 1 ? '外層' : i === d ? '內層' : '中間';
  const layerNote = i => d === 1 ? '只有一層' : `第 ${i} 層${i === 1 ? '，靠近你' : i === d ? '，在最後面' : ''}`;
  let layer = 1, picking = false;

    <div id="cell-tabs"></div><div id="cell-panel"></div><div id="cell-foot"></div>`;

function locWords(loc) {

  const room = B().cache.rooms[cab.roomId] || { name: '?' }, d = cellDepth(cab, cellKey(loc.r, loc.c));

}
const cellBookCount = loc => loc ? Object.values(B().cache.books).filter(b => b.ownership !== 'wishlist' && b.location && b.location.cabinetId === loc.cabinetId && b.location.r === loc.r && b.location.c === loc.c && b.location.depth === loc.depth).length : 0;
const firstOwner = () => (B().meta.owners || [])[0] || '';

/* ---------- 第二階段：草稿（掃到但還沒存的書） ---------- */
function setDraft(d) { app.bookDraft = d; app.bookDraftOrig = draftSig(d); }
const draftSig = d => d ? JSON.stringify({ b: d.book, p: d.photos.map(p => p.id), r: d.removed }) : '';
const bookDirty = () => !!app.bookDraft && draftSig(app.bookDraft) !== app.bookDraftOrig;
function draftFromData(data, origin, extra = {}) {
  const book = newBook({ owner: extra.owner ?? firstOwner(), location: extra.location ?? null });
  if (extra.ownership) book.ownership = extra.ownership;
  if (extra.loan) book.loan = clone(extra.loan);
  if (!canEdit()) { book.ownership = 'wishlist'; book.location = null; book.loan = null; }   // 只能檢視的人只能加到自己的願望清單
  fillEmpty(book, data);

}
async function attachCover(book) {

}
async function handleISBN(isbn, origin) {
  const dup = Object.values(B().cache.books).filter(b => b.isbn === isbn);

  else toast('查詢書目中…');
  const res = await lookupISBN(isbn);
  const d = draftFromData(res.data, origin, extra);

  d.lookup = res.ok ? (res.demo ? 'demo' : 'ok') : res.offline ? 'offline' : res.quota ? 'quota' : 'none';
  if (res.offline || res.quota) d.book.needsLookup = true;

  setDraft(d);

}
function startNoBarcode() {

function commitDraft() {

async function takeDraftPhoto(kind) {

/* ---------- 第二階段：相機掃描 ---------- */
const cam = { stream: null, timer: null, detector: null, busy: false };
async function startCamera() {
  const video = $('#scan-video'); if (!video) return;
  if (cam.stream) { video.srcObject = cam.stream; video.play().catch(() => {}); ensureLoop(); return; }
  if (!('BarcodeDetector' in window) || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { app.scan.camera = 'unsupported'; updateScanTip(); return; }
  app.scan.camera = 'starting'; updateScanTip();
  try {
    let fmts = ['ean_13', 'ean_8', 'upc_a'];
    try { const sup = await BarcodeDetector.getSupportedFormats(); if (sup && sup.length) fmts = fmts.filter(f => sup.includes(f)); } catch (e) {}
    cam.detector = new BarcodeDetector({ formats: fmts.length ? fmts : ['ean_13'] });
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
    if (app.screen !== 'main' || cur().name !== 'scan') { stream.getTracks().forEach(t => t.stop()); return; }
    cam.stream = stream;
    const v = $('#scan-video'); v.srcObject = stream; await v.play().catch(() => {});
    app.scan.camera = 'on'; updateScanTip(); ensureLoop();
  } catch (e) { app.scan.camera = e && e.name === 'NotAllowedError' ? 'denied' : 'error'; updateScanTip(); }
}
function ensureLoop() { if (!cam.timer) cam.timer = setInterval(scanTick, 220); }
async function scanTick() {
  if (cam.busy || app.scan.status !== 'idle' || openDialogs.length || document.querySelector('.cropper') || !cam.detector) return;
  const v = $('#scan-video'); if (!v || v.readyState < 2) return;
  cam.busy = true;
  try {
    const codes = await cam.detector.detect(v);
    for (const c of codes) {
      const isbn = normalizeISBN(c.rawValue); if (!isbn) continue;
      if (isbn === app.scan.lastCode && Date.now() - app.scan.lastAt < 4000) continue;
      app.scan.lastCode = isbn; app.scan.lastAt = Date.now();
      try { navigator.vibrate && navigator.vibrate(60); } catch (e) {}
      handleISBN(isbn, 'scan'); break;
    }
  } catch (e) {}
  cam.busy = false;
}
function stopCamera() {
  if (cam.timer) { clearInterval(cam.timer); cam.timer = null; }
  if (cam.stream) { cam.stream.getTracks().forEach(t => t.stop()); cam.stream = null; }
  if (app.scan.camera === 'on' || app.scan.camera === 'starting') app.scan.camera = 'off';
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) stopCamera();
  else if (app.screen === 'main' && cur() && cur().name === 'scan') startCamera();
});
async function scanFromPhoto() {
  if (!('BarcodeDetector' in window)) { toast('這個瀏覽器不能辨識條碼，請改用手動輸入 ISBN', 'err'); return; }
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*'; inp.hidden = true; inp.id = 'barcode-photo';
  document.body.append(inp);
  inp.addEventListener('change', async () => {
    const f = inp.files[0]; inp.remove(); if (!f) return;
    try {
      const bmp = await createImageBitmap(f);
      const codes = await new BarcodeDetector({ formats: ['ean_13'] }).detect(bmp);
      const isbn = codes.map(c => normalizeISBN(c.rawValue)).find(Boolean);
      if (isbn) handleISBN(isbn, 'scan'); else toast('照片裡找不到 ISBN 條碼，再拍清楚一點試試', 'err');

async function manualISBN(origin) {

  if (!v) return;
  const isbn = normalizeISBN(v);
  if (isbn) return handleISBN(isbn, origin);
  if (/^[\d\-\sXx]{9,17}$/.test(v)) { toast('這組 ISBN 的檢查碼不對，請再確認一次', 'err'); return; }

async function searchByText(q, origin) {

// 書籍頁上面那排：全部（含願望清單、借閱）/ 持有（自己的書，含借出去的；不含借入、願望清單）/ 待補 / 所有者 / 願望清單 / 借閱
const TOP_FILTERS = ['all', 'own', 'pending', 'wish', 'loan'];
function topFilterMatch(b, f) {
  if (f === 'all') return true;
  if (f === 'own') return (b.ownership || 'owned') === 'owned';
  if (f === 'pending') return !b.verified;
  if (f === 'wish') return b.ownership === 'wishlist';
  if (f === 'loan') return !!b.loan;
  return b.owner === f;
}
// 卡片左上角的標籤：願望清單、借入、借出（逾期變紅）
function bookTag(b, cls) {
  if (b.ownership === 'wishlist') return app.bookFilter === 'wish' ? '' : `<span class="${cls} wish">願望</span>`;
  if (b.loan) return `<span class="${cls} ${overdueDays(b.loan) > 0 ? 'warn' : 'loan'}">${overdueDays(b.loan) > 0 ? '逾期' : b.loan.dir === 'in' ? '借入' : '借出'}</span>`;
  if (b.circle) return `<span class="${cls} priv">小圈圈</span>`;
  if (b.private) return `<span class="${cls} priv">隱私</span>`;
  return '';
}
const adultTag = (b, cls) => b.adult ? `<span class="${cls} adult">18+</span>` : '';
function filteredBooks() {
  const q = String(app.bookQuery || '').trim().toLowerCase(), f = app.bookFilter || 'all';
  return sortBooks(Object.values(B().cache.books).filter(b => {
    if (!topFilterMatch(b, f)) return false;
    if (app.bookCat && !bookInCat(b, app.bookCat)) return false;

// 作者的姓：中文名第一個字就是姓；「史蒂芬妮．梅爾」取點後面；英文名取最後一個字
function surnameKey(name) {
  const n = String(name || '').trim(); if (!n) return '';
  const parts = n.split(/[．·・•‧]/).map(s => s.trim()).filter(Boolean);
  if (parts.length > 1) return parts[parts.length - 1] + ' ' + parts.slice(0, -1).join(' ');
  if (/^[A-Za-z]/.test(n) && n.includes(' ') && !n.includes(',')) { const p = n.split(/\s+/); return p[p.length - 1] + ' ' + p.slice(0, -1).join(' '); }
  return n;
}

    case 'publisher': return s(b.publisher);
    case 'series': return b.series ? [s(b.series), n(b.volume) === '' ? 0 : n(b.volume)] : '';
    case 'category': {   // 類型：從最上層開始一層一層比，有好幾個類型時取排最前面的

    case 'readStatus': return Object.keys(READ_STATUS).indexOf(b.readStatus || 'unread');
    case 'owner': { if (!b.owner) return ''; const i = (B().meta.owners || []).indexOf(b.owner); return i < 0 ? 999 : i; }
    case 'location': {
      const L = b.location; if (!L) return '';
      const cab = B().cache.cabinets[L.cabinetId]; if (!cab) return '';
      const rooms = sortedRooms(), ri = rooms.findIndex(r => r.id === cab.roomId);

function cmpVal(x, y) {

// 「系列與卷」不是把有系列的書另外集中，而是先照其他條件排，再讓續集跟在同系列排最前面的那本（通常是第一集）後面。
// 排在「系列與卷」前面的作者、出版商、類型、閱讀狀態、所有者、位置會先分開（同名系列但作者不同就不會被拉在一起）；
// 日期、數字、書名這種會被跨過，續集不管出版日多晚都跟著首集。
const SERIES_SPLIT = new Set(['author', 'publisher', 'category', 'readStatus', 'owner', 'location']);
function orderBooks(list, lv) {
  const si = lv.findIndex(x => x.key === 'series');
  const base = si < 0 ? lv : lv.filter((_, i) => i !== si);
  const keyed = list.map(b => ({ b, k: base.map(x => sortVal(b, x.key)) }));
  keyed.sort((p, q) => {
    for (let i = 0; i < base.length; i++) {
      const a = p.k[i], c = q.k[i], ea = a === '' || a === undefined, ec = c === '' || c === undefined;
      if (ea && ec) continue;
      if (ea) return 1; if (ec) return -1;          // 沒填的永遠排最後
      const r = cmpVal(a, c); if (r) return base[i].dir === 'desc' ? -r : r;
    }
    return zhColl.compare(p.b.title || '', q.b.title || '');
  });
  if (si < 0) return keyed.map(x => x.b);
  const desc = lv[si].dir === 'desc', split = lv.slice(0, si).filter(x => SERIES_SPLIT.has(x.key));
  const vol = b => { const v = b.volume; return v === null || v === undefined || v === '' || !isFinite(Number(v)) ? null : Number(v); };
  const groups = new Map();
  keyed.forEach((x, i) => {
    x.i = i; const sname = String(x.b.series || '').trim().toLowerCase(); if (!sname) return;
    x.g = JSON.stringify([sname, ...split.map(l => sortVal(x.b, l.key))]);
    if (!groups.has(x.g)) groups.set(x.g, []); groups.get(x.g).push(x);
  });
  const out = [], done = new Set();
  for (const x of keyed) {
    if (!x.g) { out.push(x.b); continue; }
    if (done.has(x.g)) continue; done.add(x.g);
    groups.get(x.g).sort((p, q) => {            // 同系列：照卷數，沒寫卷數的跟在後面
      const a = vol(p.b), c = vol(q.b);
      if (a === null && c === null) return p.i - q.i;
      if (a === null) return 1; if (c === null) return -1;
      return (desc ? c - a : a - c) || p.i - q.i;

}
function sortBooks(list) { return orderBooks(list, bookSortLv()); }
// 書櫃裡的順序：作者的姓 → 類型 → 系列與卷 → 書名，都是正序，沒填的排後面
const SHELF_LV = ['author', 'category', 'series', 'title'].map(key => ({ key, dir: 'asc' }));
const shelfSort = list => orderBooks(list, SHELF_LV);
function bookInCat(b, cat) {
  const ids = normCats(b.categories);
  if (cat === '__none') return !ids.length;
  return ids.some(id => id === cat || isAncestor(cat, id));
}
function advMatch(b, a) {
  if (!a) return true;
  const eq = (v, want) => want === '__none' ? !String(v ?? '').trim() : String(v ?? '').trim() === want;
  if (a.fav === 'yes' && !b.favorite) return false;
  if (a.fav === 'no' && b.favorite) return false;
  if (a.status && (b.readStatus || 'unread') !== a.status) return false;
  if (a.author && (a.author === '__none' ? (b.authors || []).some(x => x.name) : !(b.authors || []).some(x => x.name === a.author))) return false;
  if (a.publisher && !eq(b.publisher, a.publisher)) return false;
  if (a.year && !eq(pubYear(b), a.year)) return false;
  if (a.series && !eq(b.series, a.series)) return false;
  if (a.format && !eq(b.format, a.format)) return false;
  if (a.lang && !eq(langLabel(b), a.lang)) return false;
  if (a.rating) { const r = Number(b.rating) || 0; if (a.rating === 'none' ? r > 0 : r < Number(a.rating)) return false; }
  if (a.loc) {
    if (a.loc === 'none') { if (b.location) return false; }
    else {
      if (!b.location) return false;
      const [t, id] = a.loc.split(':');
      if (t === 'cab' && b.location.cabinetId !== id) return false;
      if (t === 'room') { const c = B().cache.cabinets[b.location.cabinetId]; if (!c || c.roomId !== id) return false; }

}

async function pickCatFilter() {
  const cats = B().cache.categories || {};
  const books = Object.values(B().cache.books).filter(b => topFilterMatch(b, app.bookFilter || 'all'));
  const cnt = {}; let none = 0;
  books.forEach(b => {
    const ids = normCats(b.categories); if (!ids.length) { none++; return; }
    const seen = new Set();
    ids.forEach(id => { let c = cats[id], g = 0; while (c && g++ < 12) { seen.add(c.id); c = c.parentId ? cats[c.parentId] : null; } });
    seen.forEach(id => { cnt[id] = (cnt[id] || 0) + 1; });
  });
  const cur = app.bookCat || '';
  let level = cur && cats[cur] && cats[cur].parentId && cats[cats[cur].parentId] ? cats[cur].parentId : null;
  const res = await dialog({
    title: '依類型篩選', sheet: true, focus: false,
    body: `<label class="search">${ICON.search}<span class="sr">搜尋類型</span><input id="opt-q" type="search" placeholder="搜尋類型" autocomplete="off"></label>

          return;

          + kids.map(k => row(k.id, k.name, cnt[k.id] || 0, catKids(k.id).length)).join('')

      };

async function editOwners() {
  const books = Object.values(B().cache.books), used = tally(books, b => b.owner);
  const list = (B().meta.owners || []).map(n => ({ name: n, orig: n }));
  const res = await dialog({
    title: '編輯所有者', focus: false,
    body: `<p class="hint">用箭頭調整順序，書籍頁的篩選按鈕和選單都會照這個順序。</p><div class="list mgr ownedit" id="own-list"></div><button type="button" class="opt-add" id="own-add">${ICON.plus}<span>新增所有者</span></button>`,
    actions: [{ label: '取消', kind: 'ghost', value: null }, { label: '儲存', kind: 'primary', get: () => ({ list }) }],
    onOpen: el => {
      const box = el.querySelector('#own-list');
      const draw = () => {
        box.innerHTML = list.length ? list.map((x, i) => `<div class="row"><span class="tx"><b>${esc(x.name)}</b><span>${x.orig ? (used[x.orig] ? used[x.orig] + ' 本' : '沒有書') : '新增的'}${x.orig && x.orig !== x.name ? `・原本叫「${esc(x.orig)}」` : ''}</span></span>
          <button type="button" class="round-btn sm" data-up="${i}" aria-label="${esc(x.name)} 往上移"${i === 0 ? ' disabled' : ''}>${ICON.up}</button>
          <button type="button" class="round-btn sm" data-down="${i}" aria-label="${esc(x.name)} 往下移"${i === list.length - 1 ? ' disabled' : ''}>${ICON.down}</button>
          <button type="button" class="round-btn sm" data-ren="${i}" aria-label="${esc(x.name)} 改名">${ICON.pencil}</button>
          <button type="button" class="round-btn sm danger" data-del="${i}" aria-label="刪除 ${esc(x.name)}">${ICON.trash}</button></div>`).join('')
          : '<p class="hint" style="padding:14px;margin:0">還沒有所有者。</p>';
      };
      draw();
      box.addEventListener('click', async ev => {
        const b = ev.target.closest('button'); if (!b || b.disabled) return;
        const d = b.dataset;
        if (d.up) { const i = +d.up; [list[i - 1], list[i]] = [list[i], list[i - 1]]; }
        else if (d.down) { const i = +d.down; [list[i + 1], list[i]] = [list[i], list[i + 1]]; }
        else if (d.ren) {
          const x = list[+d.ren], n = await promptBox('改名', '新的名字', x.name);
          if (!n || n === x.name) return;
          if (list.some(y => y !== x && y.name === n)) { toast('已經有這個名字了', 'err'); return; }
          x.name = n;
        } else if (d.del) {
          const x = list[+d.del], nb = x.orig ? used[x.orig] || 0 : 0;
          if (!(await confirmBox(`刪除「${x.name}」？`, nb ? `有 ${nb} 本書的所有者是「${x.orig}」，儲存後這些書會變成沒有所有者。` : '', '刪除', true))) return;
          list.splice(+d.del, 1);
        }
        draw();
      });
      el.querySelector('#own-add').addEventListener('click', async () => {
        const n = await promptBox('新增所有者', '名字', '', '例如：媽媽'); if (!n) return;
        if (list.some(y => y.name === n)) { toast('已經有這個名字了', 'err'); return; }
        list.push({ name: n, orig: null }); draw();
        box.scrollTop = box.scrollHeight;
      });
    }
  });
  if (!res) return;
  const finalNames = list.map(x => x.name), ren = {};
  list.forEach(x => { if (x.orig && x.orig !== x.name) ren[x.orig] = x.name; });
  const kept = new Set(list.map(x => x.orig).filter(Boolean));
  const removed = new Set((B().meta.owners || []).filter(o => !kept.has(o) && !finalNames.includes(o)));
  let n = 0;
  books.forEach(b => {
    if (b.owner && ren[b.owner] !== undefined) { B().put('books', { ...b, owner: ren[b.owner] }); n++; }
    else if (b.owner && removed.has(b.owner)) { B().put('books', { ...b, owner: '' }); n++; }
  });
  B().putMeta({ owners: finalNames });
  const fix = v => ren[v] !== undefined ? ren[v] : removed.has(v) ? null : v;
  if (app.session.owner) { const v = fix(app.session.owner); app.session.owner = v || ''; saveSession(); }
  if (!TOP_FILTERS.includes(app.bookFilter)) app.bookFilter = fix(app.bookFilter) || 'all';
  toast(n ? `已儲存，更新了 ${n} 本書` : '已儲存');
  render();
}

const CUR_SIGN = { TWD: 'NT$', USD: 'US$', JPY: '¥', CNY: 'CN¥', HKD: 'HK$', EUR: '€' };
function moneyFmt(cur, n) {
  const whole = cur === 'TWD' || cur === 'JPY';
  return `${CUR_SIGN[cur] || cur + ' '}${Number(n || 0).toLocaleString('zh-TW', { maximumFractionDigits: whole ? 0 : 2 })}`;
}
const hasPrice = b => b.price !== null && b.price !== undefined && b.price !== '' && isFinite(Number(b.price));
function moneyOf(list) {
  const m = {};
  list.forEach(b => { if (!hasPrice(b)) return; const c = b.currency || 'TWD'; m[c] = (m[c] || 0) + Number(b.price) * (b.quantity || 1); });
  return m;
}

async function clipboardImage() {

  let items;

  for (const it of items) if (it.types.includes('text/plain')) { const s = (await (await it.getType('text/plain')).text()).trim(); if (/^https?:\/\//.test(s)) return { url: s }; }
  return { err: 'empty' };
}

/* ---------- AI 讀圖（Gemini，自己的金鑰） ---------- */
const AI_KEY = 'tsundoku-ai-key', AI_MODEL = 'tsundoku-ai-model', AI_MODELS = 'tsundoku-ai-models';
const AI_BASE = 'https://generativelanguage.googleapis.com/v1beta';
const AI_PROMPTS = {
  blurb: `這是一本書的封底、書腰或摺口照片，上面有介紹這本書的文案。請把文案轉成文字：
- 照原文用字，不要翻譯、改寫或摘要；繁體就用繁體，簡體就用簡體。
- 直排文字依照由右到左、由上到下的順序讀。
- 不要收錄價格、ISBN、條碼數字、出版社地址電話、網址、分類號這類資訊。
- 段落之間用一個空行分開。看不清楚的字用「□」代替。
只回傳 JSON：{"text": "文案內容"}。照片裡沒有文案的話，text 回傳空字串。`,
  copyright: `這是一本書的版權頁照片。請讀出書目資料，只回傳一個 JSON 物件，找不到的欄位填 null，不要猜：
{"title": 書名, "subtitle": 副標題, "originalTitle": 原文書名（翻譯書才有）, "series": 叢書或系列名稱, "volume": 第幾卷（數字）,
 "authors": [{"name": 姓名, "role": "著"、"譯"、"編"、"繪"、"校訂"、"審訂"、"導讀"、"攝影" 其中之一}],
 "publisher": 出版社名稱（照版權頁寫的）,
 "publishedDate": 這個版次第一刷的日期，格式 YYYY-MM-DD、YYYY-MM 或 YYYY；民國年請加 1911 換成西元,
 "edition": 版次，例如 "初版"、"二版"、"修訂版"（只寫「版」，不含「刷」）,
 "printing": 這一本是第幾刷（數字；列了好幾刷時取最新的那一刷）,
 "isbn": ISBN（只要數字，有 13 碼就給 13 碼）, "price": 定價（數字）,
 "currency": 幣別代碼，新台幣 TWD、港幣 HKD、人民幣 CNY、日圓 JPY、美金 USD, "pages": 頁數（數字）}
照片上的字照原文用字，不要翻譯。`
};
function aiModelOK(n) { return /gemini/.test(n) && /flash/.test(n) && !/(tts|image|audio|live|embed|thinking|native|computer|robotics)/.test(n); }
function aiPickModel(list) {
  const ver = n => { const m = n.match(/gemini-(\d+(?:\.\d+)?)/); return m ? parseFloat(m[1]) : 0; };
  const score = n => (/lite/.test(n) ? 100 : 0) + ver(n) - (/(preview|exp)/.test(n) ? 50 : 0) + (/latest/.test(n) ? 0.5 : 0);
  return [...list].sort((a, b) => score(b) - score(a))[0] || '';
}
async function aiFetch(path, opts = {}, ms = 60000) {
  const key = LS.get(AI_KEY); if (!key) { const e = new Error('nokey'); e.code = 'nokey'; throw e; }
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), ms);
  let r;
  try { r = await fetch(AI_BASE + path, { ...opts, signal: ctl.signal, headers: { 'content-type': 'application/json', 'x-goog-api-key': key, ...(opts.headers || {}) } }); }
  catch (e) { const er = new Error('offline'); er.code = 'offline'; throw er; }

  if (!r.ok) {
    const txt = await r.text().catch(() => '');
    const er = new Error('HTTP ' + r.status); er.status = r.status;
    er.code = r.status === 429 ? 'quota' : /API_KEY|API key/i.test(txt) || r.status === 401 || r.status === 403 ? 'badkey' : r.status === 404 ? 'nomodel' : 'error';
    throw er;
  }
  return r.json();
}
async function aiListModels() {
  const j = await aiFetch('/models?pageSize=1000', { method: 'GET' }, 20000);
  const list = (j.models || []).filter(m => (m.supportedGenerationMethods || []).includes('generateContent')).map(m => String(m.name).replace(/^models\//, '')).filter(aiModelOK);
  LS.set(AI_MODELS, list);
  return list;
}
function parseLooseJSON(s) {
  s = String(s || '').trim().replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/, '');
  try { return JSON.parse(s); } catch (e) {}
  const a = s.indexOf('{'), b = s.lastIndexOf('}');
  if (a >= 0 && b > a) { try { return JSON.parse(s.slice(a, b + 1)); } catch (e) {} }
  return null;
}
async function aiReadPhoto(p, kind) {
  let model = LS.get(AI_MODEL);
  if (!model) { model = aiPickModel(await aiListModels()); if (!model) { const e = new Error('nomodel'); e.code = 'nomodel'; throw e; } LS.set(AI_MODEL, model); }
  const m = String(p.data).match(/^data:([^;]+);base64,(.*)$/); if (!m) { const e = new Error('badimage'); e.code = 'error'; throw e; }
  const body = { contents: [{ role: 'user', parts: [{ text: AI_PROMPTS[kind] }, { inline_data: { mime_type: m[1], data: m[2] } }] }], generationConfig: { temperature: 0, responseMimeType: 'application/json' } };
  let j;
  try { j = await aiFetch(`/models/${encodeURIComponent(model)}:generateContent`, { method: 'POST', body: JSON.stringify(body) }); }
  catch (e) { if (e.code === 'nomodel') LS.del(AI_MODEL); throw e; }
  const c = (j.candidates || [])[0] || {};
  if (c.finishReason === 'RECITATION' || c.finishReason === 'SAFETY' || (j.promptFeedback && j.promptFeedback.blockReason)) { const e = new Error('blocked'); e.code = 'blocked'; throw e; }
  const out = parseLooseJSON(((c.content || {}).parts || []).map(x => x.text || '').join(''));
  if (!out) { const e = new Error('format'); e.code = 'format'; throw e; }
  return out;
}
function aiErrorBox(e) {
  const msg = {
    nokey: ['還沒設定 AI 金鑰', '<p>到「設定 › AI 讀圖」貼上 Gemini 的免費金鑰就能用。</p>'],
    badkey: ['金鑰不能用', '<p>Gemini 金鑰不對，或沒有權限。到「設定 › AI 讀圖」重新貼一次。</p>'],
    quota: ['次數用完了', '<p>免費額度有每分鐘和每天的上限。等一下再試；如果是今天的次數用完了，台灣時間下午 3、4 點（美國太平洋時間半夜）會重新計算。</p>'],
    offline: [app.inFrame ? '預覽頁不能連網' : '連不上 Gemini', app.inFrame ? '<p>部署到 GitHub 之後才能用 AI 讀圖。</p>' : '<p>請確認網路，再試一次。</p>'],
    nomodel: ['找不到可用的模型', '<p>到「設定 › AI 讀圖」重新儲存一次，會自動選一個可以用的模型。</p>'],

const ZH_NUM = { 一: 1, 二: 2, 兩: 2, 三: 3, 四: 4, 五: 5, 六: 6, 七: 7, 八: 8, 九: 9, 十: 10 };

/* ---------- 日期小工具 ---------- */
function parseDay(s) { const m = String(s || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; }

function readingLine(b) {

  const parts = []; let head = '';

    const n = daysBetween(s, f);
    if (n !== null && n >= 0) {
      const days = n + 1, pace = st === 'done' && b.pages ? Math.round(b.pages / days) : 0;
      head = `${esc(s)} → ${esc(f)}`;
      parts.push(st === 'dropped' ? `讀了 ${days} 天後放下` : `看了 ${days} 天`);
      if (pace) parts.push(`平均一天 ${pace} 頁`);
    } else { head = `${esc(s)} → ${esc(f)}`; parts.push('日期好像填反了'); }
  } else if (s) {
    const n = daysBetween(s, todayStr());
    head = `${esc(s)} 開始讀`;
    if (st === 'reading' && n !== null && n >= 0) parts.push(n === 0 ? '今天開始' : `已經 ${n + 1} 天`);
  } else if (f) head = `${esc(f)} ${st === 'dropped' ? '放下' : '讀完'}`;
  return head ? `<div class="readline">${ICON.calendar}<span class="rl"><b>${head}</b>${parts.length ? `<span class="readsum">${parts.join('・')}</span>` : ''}</span></div>` : '';
}

/* ---------- 照片回收桶 ---------- */
const BIN_KINDS = ['copyright', 'stamp', 'blurb'];
const binDays = () => Number(B().meta.binDays) || 30;

function binLeft(at) { const t = new Date(at).getTime(); return isNaN(t) ? binDays() : Math.max(0, Math.ceil((t + binDays() * 864e5 - Date.now()) / 864e5)); }
function binAll() {

}
async function binBookPhotos(bookId) {
  if (!binOn()) return 0;
  let ps = [];

  if (!ps.length) return 0;

  delete app.photoCache[bookId];
  const b = B().cache.books[bookId];
  if (b) B().put('books', { ...b, photoBin: [...(b.photoBin || []), ...ps.map(p => ({ id: p.id, kind: p.kind, at, size: Math.round(String(p.data || '').length * 0.75) }))] });

}

  ps.forEach(p => B().putPhoto({ ...p, trashedAt: null }));

  B().put('books', { ...B().cache.books[bookId], photoBin: [] });

}

    const bin = b.photoBin || []; if (!bin.length || !(isAdmin() || b.private)) return;
    const gone = bin.filter(x => all || new Date(x.at).getTime() < cutoff); if (!gone.length) return;
    gone.forEach(x => B().removePhoto(x.id, b.id)); n += gone.length;

}

}

    }
  }
}

async function circleOpen(cid) {

// 退出：先處理書（勾選 → 選做法，直到清單清空），最後確認
async function leaveCircleFlow(cid) {
  const b = B(), c = b.circles[cid]; if (!c) return false;
  const last = (c.members || []).length <= 1, name = c.name, kept = new Set();
  for (;;) {
    const books = Object.values(b.cache.books).filter(x => x.circle === cid && (last || x.circleBy === b.me.uid) && !kept.has(x.id)).sort((x, y) => zhColl.compare(x.title || '', y.title || ''));
    if (!books.length) break;
    const r = await dialog({
      title: last ? `你是「${name}」最後一個人` : `退出「${name}」前`, sheet: true, focus: false,
      body: `<p class="hint" style="margin-top:0">${last ? `你退出後「${esc(name)}」就解散了，圈裡的書要怎麼處理？` : '你放進來的書要怎麼處理？'}勾選幾本、選一個做法，直到清單清空。</p>
        <label class="row" style="padding:6px 2px"><input type="checkbox" id="lv-all" style="width:22px;height:22px;accent-color:var(--brown)"><span class="tx"><b>全選</b></span></label>
        <div class="list pickrows lvlist">${books.map(x => `<label class="row"><input type="checkbox" value="${x.id}">${coverThumb(x, 'thumb')}<span class="tx"><b>${esc(x.title || '書名待補')}</b><span>${esc(authorsText(x) || '作者待補')}</span></span></label>`).join('')}</div>
        <div class="lvacts">${last ? '' : '<button type="button" class="btn soft" data-act="keep">留在圈裡</button>'}${canEdit() ? '<button type="button" class="btn soft" data-act="pub">公開</button>' : ''}<button type="button" class="btn soft" data-act="me">鎖隱私</button><button type="button" class="btn danger" data-act="bin">丟掉</button></div>`,
      actions: [{ label: '先不退出', kind: 'ghost', value: null }],
      onOpen: (el, close) => {
        const boxes = () => [...el.querySelectorAll('.lvlist input')];
        el.querySelector('#lv-all').addEventListener('change', ev => boxes().forEach(x => { x.checked = ev.target.checked; }));
        el.querySelector('.lvacts').addEventListener('click', ev => {
          const t = ev.target.closest('[data-act]'); if (!t) return;
          const ids = boxes().filter(x => x.checked).map(x => x.value);
          if (!ids.length) { toast('先勾選要處理的書', 'err'); return; }
          close({ act: t.dataset.act, ids });
        });
      }
    });
    if (!r) return false;
    for (const id of r.ids) {
      const x = b.cache.books[id]; if (!x) continue;
      if (r.act === 'keep') kept.add(id);
      else if (r.act === 'pub') b.put('books', { ...x, circle: null, private: false });
      else if (r.act === 'me') b.put('books', { ...x, circle: null, private: true });
      else if (r.act === 'bin') {
        if (last) { b.put('books', { ...x, circle: null, private: true }); b.binBook(id, 'circle:' + name); }   // 圈要解散了：丟進自己的回收桶，之後還能還原
        else b.binBook(id);
      }
    }
    toast({ keep: '留在圈裡', pub: '已公開', me: '已改成只有你看得到', bin: '已丟進回收桶' }[r.act] + `（${r.ids.length} 本）`);
  }
  const binLeft = last ? Object.values(b.trash || {}).filter(x => x.circle === cid).length : 0;
  const ok = await confirmBox(`退出「${name}」？`, last
    ? `你是最後一個人，退出後「${name}」就解散了${(c.pending || []).length ? '，還沒接受的邀請也會取消' : ''}。${binLeft ? `回收桶裡還有 ${binLeft} 本這個小圈圈的書，` : '如果還有你看不到的書，'}之後交給管理者永久刪除（他看不到書名）。`
    : `退出後就看不到「${name}」裡的書了。要再加入，請圈裡的人再邀請你。`, '退出', true);
  if (!ok) return false;
  b.leaveCircle(cid); toast(`已退出「${name}」`); return true;
}

AI_PROMPTS.spines = `這是書架上一排書的書背照片。請由左到右（橫放的書由上到下）列出每一本書，只回傳 JSON：

async function spineScan() {

  const list = (Array.isArray(out.books) ? out.books : []).map(x => ({ title: str(x && x.title), author: str(x && x.author), publisher: str(x && x.publisher), volume: zhToNum(x && x.volume), unsure: !!(x && x.unsure) })).filter(x => x.title && x.title !== 'null');
  if (!list.length) return infoBox('沒認出書', '<p>照片裡沒找到看得清楚的書背。光線亮一點、書背正對鏡頭再拍一次。</p>');
  const have = new Set(Object.values(B().cache.books).map(b => normTitle(b.title)));
  list.forEach(x => { x.dup = have.has(normTitle(x.title)); });
  const owner = (app.session && app.session.owner) || firstOwner();
  const r = await dialog({
    title: `認出 ${list.length} 本書`, sheet: true, focus: false,
    body: `<p class="small muted">勾選要登記的書，書名可以直接改。會登記到 <b>${esc(where)}</b>${owner ? `，所有者 ${esc(owner)}` : ''}，先標成待補資料。</p>
      <div class="list ailist">${list.map((x, i) => `<div class="airow sprow"><input type="checkbox" data-c="${i}"${x.dup ? '' : ' checked'} aria-label="登記第 ${i + 1} 本"><span class="tx"><input type="text" class="sp-title" data-t="${i}" value="${esc(x.title)}" aria-label="第 ${i + 1} 本的書名"><small>${esc([x.author, x.publisher, x.volume ? `第 ${x.volume} 卷` : ''].filter(Boolean).join('・'))}${x.unsure ? `${x.author || x.publisher ? '・' : ''}有字看不清楚` : ''}${x.dup ? `<b class="overdue">${x.author || x.publisher || x.unsure ? '・' : ''}已經有同名的書</b>` : ''}</small></span></div>`).join('')}</div>
      <label class="check-row"><input type="checkbox" id="sp-lookup" checked><span>用書名上網查書目，書名完全一樣才補資料</span></label>`,
    actions: [{ label: '取消', kind: 'ghost', value: null }, { label: '登記勾選的書', kind: 'primary', get: el => ({ rows: list.map((x, i) => ({ ...x, title: el.querySelector(`[data-t="${i}"]`).value.trim(), on: el.querySelector(`[data-c="${i}"]`).checked })), lookup: el.querySelector('#sp-lookup').checked }) }]
  });
  if (!r) return;
  const made = r.rows.filter(x => x.on && x.title).map(x => {
    const b = newBook(); b.title = x.title;
    if (x.author) b.authors = [{ name: x.author, role: '著' }];
    if (x.publisher) b.publisher = x.publisher;
    if (x.volume) b.volume = x.volume;

    return b;
  });
  if (!made.length) return;
  made.forEach(b => { rememberPublisher(b.publisher); B().put('books', b); });
  app.scan.lastSaved = `${made.length} 本（認書背）`; updateScanSheet();
  toast(`已登記 ${made.length} 本到 ${where}`);
  if (!r.lookup) return;
  let filled = 0;
  for (const b of made) {
    let res; try { res = await searchBooks([b.title, ((b.authors || [])[0] || {}).name].filter(Boolean).join(' ')); } catch (e) { break; }
    if (res.offline) break;
    if (res.quota && !res.results.length) { toast('Google 書目額度用完了，剩下的之後再補', 'err'); break; }
    const hit = res.results.find(x => normTitle(x.title) === normTitle(b.title));
    const cur = B().cache.books[b.id];
    if (hit && cur) { const nb = clone(cur); fillEmpty(nb, hit); nb.needsLookup = false; B().put('books', nb); filled++; }
  }
  if (filled) toast(`其中 ${filled} 本查到書目，已經補上`);
}

// 分享進來的是網址時，盡量找出圖片：Google 的 imgres 連結裡有 imgurl，網站允許的話直接下載
async function imageFromShareText(info) {
  const all = Object.values((info && info.texts) || {}).join(' ');
  const urls = [...all.matchAll(/https?:\/\/[^\s"'<>]+/g)].map(m => m[0]);
  for (let u of urls) {
    try { const x = new URL(u); const iu = x.searchParams.get('imgurl') || x.searchParams.get('mediaurl'); if (iu) u = iu; else if (/(^|\.)google\./.test(x.hostname) && x.pathname === '/search') continue; } catch (e) {}
    try {
      const r = await fetch(u, { mode: 'cors' }), t = r.headers.get('content-type') || '';
      if (r.ok && t.startsWith('image/')) return { blob: await r.blob(), url: u };
    } catch (e) {}
    if (/\.(jpe?g|png|webp|gif)(\?|$)/i.test(u) || /encrypted-tbn\d*\.gstatic\.com|\/images\?q=tbn/.test(u)) return { url: u, linkOnly: true };
  }
  return null;
}

function exportCSV() {
  const cols = [['title', '書名'], ['subtitle', '副標題'], ['originalTitle', '原著名'], ['series', '系列'], ['volume', '卷'], ['authors', '作者'], ['publisher', '出版商'], ['publishedDate', '出版日期'], ['edition', '版次'], ['printing', '刷次'], ['isbn', 'ISBN'], ['format', '格式'], ['language', '語言'], ['pages', '頁數'], ['categories', '類型'], ['owner', '所有者'], ['quantity', '數量'], ['location', '位置'], ['locationNote', '位置補充'], ['price', '價格'], ['currency', '幣別'], ['purchaseDate', '購買日期'], ['tags', '標籤'], ['readStatus', '閱讀狀態'], ['rating', '評分'], ['ownership', '擁有狀態'], ['loan', '借閱'], ['verified', '資料已確認'], ['addedAt', '加入日期'], ['id', 'ID']];
  const val = (b, k) => {
    switch (k) {
      case 'authors': return authorsText(b);
      case 'language': return langLabel(b);
      case 'location': return locCode(b);
      case 'tags': return (b.tags || []).join('#');
      case 'readStatus': return READ_STATUS[b.readStatus] || '';
      case 'ownership': return b.ownership === 'wishlist' ? '願望清單' : b.ownership === 'borrowed' ? '借來的' : '已收藏';
      case 'categories': return catRows(b.categories).map(r => r.text.replace(/ › /g, '>')).join('；');
      case 'quantity': return b.quantity || 1;
      case 'loan': return b.loan ? `${b.loan.dir === 'in' ? '借入' : '借出'}：${b.loan.person || ''} ${b.loan.date || ''}${b.loan.due ? ` 預計 ${b.loan.due} 還` : ''}`.trim() : '';
      case 'verified': return b.verified ? '是' : '否';
      case 'addedAt': return fmtDate(b.addedAt);

}
